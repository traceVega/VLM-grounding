# SPEC v1.2 Section 1. Values still to be pinned carry PIN_REQUIRED; a kill run
# refuses the file until they are filled (shared/harness/model_config.py).
model_id: qwen3vl-8b-instruct
hf_path: Qwen/Qwen3-VL-8B-Instruct
revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b   # downloaded 2026-09-03
dtype: bfloat16
attn_impl:
  text_config: eager_capture
  vision_config: sdpa
backend_default: hf             # vLLM only after the P21 parity run (SPEC Section 5)
resolution_policy:
  kind: pixels
  fields: [min_pixels, max_pixels]   # values come from run-level overrides (P21)
prompt_templates:
  grounding: grounding_qwen3vl_primary
  groundingme: grounding_qwen3vl_primary
  presence: verifier_headnoun
  # P13: "the grounding instruction with the expression replaced by 'the
  # object'". The same template, rendered with a different expr -- not a copy of
  # it. A separate file would be free to drift from the instruction it is meant
  # to control for, and then T_NULL would differ from the real condition in two
  # ways instead of one. Molmo2's config already did it this way.
  t_null: grounding_qwen3vl_primary
  cocosearch18: cocosearch18_category
# Measured 2026-09-03, not read off the card, which does not say (Q-3). The same
# image was sent at two caps so the resized frame halved (1536 -> 768 px) while
# the scene did not: the coordinates did not move, ratio 0.999 where
# absolute_resized would give 0.5, with a largest coordinate of 980. Evidence in
# tables/q3_coordinate_probe.json.
#
# Worth stating because the obvious assumption is wrong: Qwen2.5-VL moved to
# absolute pixels of the resized input, and Qwen3-VL has not inherited that.
# Reading these as absolute_resized would misplace every box by the cap's
# downscale factor -- silently, since the numbers stay in range.
coordinate_convention: relative_1000
parser: qwen3vl_box
abstain_protocol:
  primary:
    prompt_suffix: ""
    # GroundingME's own instruction ends: 'If no matching object is found,
    # output {"bbox_2d": null}.' So the primary protocol's abstention is
    # structural, not a phrase -- shared/harness/parsers.parse_qwen3vl reads the
    # JSON null directly and returns output_type 'none'. There is no text
    # pattern to match, and inventing one would only create a second way to
    # abstain that the benchmark never offered.
    #
    # This matters beyond parsing: the design's deviation (3) assumed the
    # primary protocol gives the models no way to abstain, which is the stated
    # reason P16 (b) was replaced by the box-shift form (b'). It does give them
    # one. See notes/OPEN-QUESTIONS.md Q-1.
    none_patterns: []
    null_box: json_null
  secondary:
    prompt_suffix: "If the object is not present, output none."
    none_patterns: ["none", "no such object", "not present"]
    null_box: null
output_type_support: [box, none]
tokens:
  yes_ids: []
  no_ids: []
