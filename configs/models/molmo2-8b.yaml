# SPEC v1.2 Section 1, with design P19: Molmo2 is served by vLLM (native support);
# the Hugging Face trust_remote_code path is the batch-one parity spot check of
# acceptance check 4. Resolution is the processor's crop policy, not max_pixels.
model_id: molmo2-8b
hf_path: allenai/Molmo2-8B
revision: e28fa28597e5ec5e0cca2201dd8ab33d48bc4a1b
dtype: bfloat16
attn_impl: sdpa
backend_default: vllm           # P19: no Hugging Face-native implementation
resolution_policy:
  kind: crops
  # P19: "the processor's default crop settings (maximum crop count and crop
  # size), recorded in the model config". Read from preprocessor_config.json at
  # the pinned revision 2026-09-03, not chosen by us.
  max_crops: 8
  crop_size: 378
  patch_size: 14
  pooling_size: [2, 2]
  overlap_margins: [4, 4]
prompt_templates:
  grounding: pointing_molmo2_primary
  presence: verifier_headnoun
  t_null: pointing_molmo2_primary
  cocosearch18: cocosearch18_category
# Confirmed 2026-09-03 from the model's own decoding code, quoted in the card:
#   POINTS_REGEX = r"([0-9]+) ([0-9]{3,4}) ([0-9]{3,4})"
#   # our points format assume coordinates are scaled by 1000
#   x, y = float(x)/1000*image_w, float(y)/1000*image_h
# So points are 0-1000 integers against the ORIGINAL image size, not floats.
# This field previously read percent_float, which was Molmo v1's convention and
# would have divided every coordinate by the wrong constant (OPEN-QUESTIONS Q-2).
coordinate_convention: relative_1000
# The tag the coordinates arrive in: <points ... coords="..."/> for images,
# <tracks .../> for video. Only the image form is used here.
point_output_pattern: '<(?:points|tracks).*? coords="([0-9\t:;, .]+)"/?>'
parser: molmo2_point
abstain_protocol:
  primary:
    prompt_suffix: ""
    # Still PIN_REQUIRED after reading the card at the pinned revision: the card
    # documents pointing but never shows a no-such-object answer, and no
    # abstention string appears in the shipped processor or modeling code. P12
    # already names where this is settled -- the p12 dev slice of 100 gRefCOCO
    # no-target items under --non-kill -- so it is measured, not guessed.
    none_patterns: [PIN_REQUIRED]
    null_box: null
  secondary:
    prompt_suffix: "If there is no such object, say none."
    none_patterns: ["none", "no such object", "there is no"]
    null_box: null
output_type_support: [point, set, none]
tokens:
  yes_ids: []
  no_ids: []
